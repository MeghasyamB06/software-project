<ion-content class="bloodlink-login" [scrollY]="true">
  <div class="login-wrapper">
    <!-- Brand Section -->
    <header class="brand-section">
      <div class="logo-ring">
        <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg" class="logo-drop" aria-hidden="true">
          <path d="M12 2C12 2 5.5 9.5 5.5 14.5C5.5 18.09 8.41 21 12 21C15.59 21 18.5 18.09 18.5 14.5C18.5 9.5 12 2 12 2Z" fill="white"/>
          <path d="M9.5 14.5C9.5 15.88 10.62 17 12 17" stroke="#B91C3C" stroke-width="1.5" stroke-linecap="round"/>
        </svg>
      </div>
      <h1 class="brand-name">BloodLink</h1>
      <p class="brand-tagline">Connecting blood donors with those in need</p>
    </header>

    <!-- Login Card -->
    <main class="login-card">
      <div class="card-heading">
        <h2>Welcome Back</h2>
        <p>Sign in to continue saving lives</p>
      </div>

      <form (ngSubmit)="onLogin()" novalidate>
        <!-- Email / Mobile -->
        <div class="field-group">
          <label class="field-label" for="email">Email or Mobile Number</label>
          <div class="input-shell">
            <ion-icon name="mail-outline" class="input-icon" aria-hidden="true"></ion-icon>
            <input
              id="email"
              type="text"
              class="native-input"
              placeholder="Enter email or mobile"
              autocomplete="email"
              inputmode="email"
              aria-label="Email or mobile number"
              [(ngModel)]="credentials.email"
              name="email"
              [disabled]="isLoading"
            />
          </div>
        </div>

        <!-- Password -->
        <div class="field-group">
          <label class="field-label" for="password">Password</label>
          <div class="input-shell">
            <ion-icon name="lock-closed-outline" class="input-icon" aria-hidden="true"></ion-icon>
            <input
              id="password"
              [type]="showPassword ? 'text' : 'password'"
              class="native-input"
              placeholder="Enter your password"
              autocomplete="current-password"
              aria-label="Password"
              [(ngModel)]="credentials.password"
              name="password"
              [disabled]="isLoading"
            />
            <button
              type="button"
              class="eye-toggle"
              (click)="togglePasswordVisibility()"
              [attr.aria-label]="showPassword ? 'Hide password' : 'Show password'"
              [disabled]="isLoading"
            >
              <ion-icon [name]="showPassword ? 'eye-off-outline' : 'eye-outline'"></ion-icon>
            </button>
          </div>
        </div>

        <!-- Forgot Password -->
        <div class="forgot-row">
          <button type="button" class="link-button" (click)="onForgotPassword()" [disabled]="isLoading">
            Forgot Password?
          </button>
        </div>

        <!-- Login Button -->
        <ion-button
          type="submit"
          expand="block"
          class="login-btn"
          [disabled]="!credentials.email || !credentials.password || isLoading"
          aria-label="Login to BloodLink"
        >
          <ion-spinner *ngIf="isLoading" name="crescent" class="btn-spinner"></ion-spinner>
          <span *ngIf="!isLoading">Login</span>
          <span *ngIf="isLoading" class="sr-only">Signing in, please wait</span>
        </ion-button>
      </form>

      <!-- Divider -->
      <div class="divider" role="separator" aria-label="or">
        <span class="divider-line"></span>
        <span class="divider-text">OR</span>
        <span class="divider-line"></span>
      </div>

      <!-- Google Sign In -->
      <button type="button" class="google-btn" (click)="onGoogleSignIn()" [disabled]="isLoading" aria-label="Continue with Google">
        <svg viewBox="0 0 24 24" class="google-icon" aria-hidden="true">
          <path fill="#4285F4" d="M23.49 12.27c0-.85-.08-1.66-.22-2.45H12v4.64h6.45a5.52 5.52 0 0 1-2.39 3.62v3h3.87c2.26-2.08 3.56-5.15 3.56-8.81Z"/>
          <path fill="#34A853" d="M12 24c3.24 0 5.96-1.07 7.94-2.92l-3.87-3c-1.07.72-2.45 1.15-4.07 1.15-3.13 0-5.78-2.11-6.73-4.96H1.29v3.1A12 12 0 0 0 12 24Z"/>
          <path fill="#FBBC05" d="M5.27 14.27A7.2 7.2 0 0 1 4.89 12c0-.79.14-1.56.38-2.27v-3.1H1.29a12 12 0 0 0 0 10.74l3.98-3.1Z"/>
          <path fill="#EA4335" d="M12 4.77c1.76 0 3.35.61 4.6 1.8l3.44-3.44A11.98 11.98 0 0 0 12 0 12 12 0 0 0 1.29 6.63l3.98 3.1C6.22 6.88 8.87 4.77 12 4.77Z"/>
        </svg>
        <span>Continue with Google</span>
      </button>
    </main>

    <!-- Register -->
    <footer class="register-section">
      <p class="register-text">
        Don't have an account?
        <button type="button" class="link-button register-link" (click)="onRegister()" [disabled]="isLoading">Register</button>
      </p>
      <p class="register-subtext">Donor or Hospital account</p>
    </footer>
  </div>
</ion-content>
